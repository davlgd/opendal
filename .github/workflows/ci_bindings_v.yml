name: Bindings V CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths: &paths
      - "core/**"
      - "bindings/c/**"
      - "bindings/v/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_v.yml"
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The binding follows V master, which has language changes the latest tagged release lacks.
      - name: Setup V
        shell: bash
        run: |
          git clone --depth 1 https://github.com/vlang/v "${RUNNER_TEMP}/v"
          make -C "${RUNNER_TEMP}/v"
          echo "${RUNNER_TEMP}/v" >> "${GITHUB_PATH}"

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Build C binding
        working-directory: bindings/c
        run: cargo build --features opendal/services-fs

      - name: Check
        working-directory: bindings/v
        run: v fmt -verify opendal/ examples/

      - name: Run tests
        working-directory: bindings/v
        run: v -cc cc test opendal/

      - name: Run tests against the shared library
        working-directory: bindings/v
        run: v -cc cc -d opendal_shared test opendal/

      - name: Run getting-started example
        working-directory: bindings/v
        run: v -cc cc run examples/getting_started.v
